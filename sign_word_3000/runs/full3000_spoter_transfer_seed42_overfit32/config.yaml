experiment:
  name: full3000_spoter_transfer_seed42
  seed: 42
paths:
  source_manifest: ../mediapipe_processed/manifests/samples.csv
  source_h5_root: ..
  selected_words: ../단어번호_단어_3000.csv
  transfer_checkpoint: ../sign_word_300/runs/pilot300_spoter_base_seed42_train/best.pt
  workspace_data: data
  runs: runs
data:
  feature_version: spoter2_mp_xy_v1
  feature_dim: 208
  max_sequence_length: 256
  train_actors: ['01', '02', '03', '04', '05', '06']
  val_actors: ['07', '08']
  test_actors: ['09']
  num_workers: 4
  pin_memory: true
model:
  name: spoter_208
  input_dim: 208
  d_model: 256
  nhead: 8
  encoder_layers: 6
  decoder_layers: 6
  dim_feedforward: 1024
  dropout: 0.1
  activation: gelu
  num_classes: auto
training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.00005
  weight_decay: 0.01
  warmup_epochs: 5
  gradient_clip_norm: 1.0
  amp: fp16
  early_stopping_patience: 15
  resume: true

